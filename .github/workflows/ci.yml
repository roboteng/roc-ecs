name: CI

on:
  pull_request:
    branches: [main]
  # The release workflow runs these same checks before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  # The package is pure Roc with no platform, so it tracks the latest nightly.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427 # v0.3.0
        with:
          version: nightly-new-compiler

      - run: roc fmt --check package examples

      - run: roc test package/main.roc

      - id: previous
        uses: roc-lang/release-package/actions/resolve-previous-release@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          github_token: ${{ github.token }}

      # Show which version merging this would release, and fail here rather
      # than after the merge if `roc bump` cannot compare the two APIs.
      - name: Preview version bump
        if: ${{ steps.previous.outputs.previous_url != '' }}
        env:
          PREVIOUS_URL: ${{ steps.previous.outputs.previous_url }}
        run: roc bump --old "$PREVIOUS_URL" package/main.roc

  # The examples run on roc-ray. Since 0.11.0 it names no compiler and is
  # tested nightly against the latest one, so the examples track it too.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427 # v0.3.0
        with:
          version: nightly-new-compiler

      # `roc check` exits non-zero for warnings as well as errors.
      - name: Check examples
        run: |
          set -euo pipefail
          for example in examples/*.roc; do
            roc check "$example"
          done
